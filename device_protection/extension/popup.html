<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EduFeedia Safe Shield</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 300px;
      margin: 0;
      padding: 16px;
      background: #F8FAFC;
      color: #172033;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 10px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #EAF3FF;
      color: #2563EB;
    }
    .status-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .active-tag {
      color: #34BFA3;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #2563EB;
      color: #FFFFFF;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
    }
    .pin-box {
      margin-top: 10px;
      display: none;
    }
    .pin-input {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="font-size: 22px;">🛡️</div>
    <div>
      <div style="font-weight: 800; font-size: 15px; color: #2563EB;">EduFeedia Safe Shield</div>
      <div style="font-size: 11px; color: #64748B;">Device-Wide Protection</div>
    </div>
  </div>

  <div class="status-card">
    <div class="status-row">
      <span>Status:</span>
      <span class="active-tag">● Protected & Active</span>
    </div>
    <div class="status-row">
      <span>Active Profile:</span>
      <span style="font-weight: 700;">Aarav (Age 7)</span>
    </div>
    <div class="status-row">
      <span>SafeSearch:</span>
      <span class="active-tag">Strict Enforced</span>
    </div>
    <div class="status-row">
      <span>Mature Content:</span>
      <span style="color: #FF7A59; font-weight: 700;">Blocked</span>
    </div>
  </div>

  <button id="parentGateBtn" class="btn">Parent Controls & PIN Unlock</button>

  <div id="pinBox" class="pin-box">
    <input type="password" id="pinInput" class="pin-input" placeholder="Enter 4-digit Parent PIN" maxlength="4">
    <button id="verifyPinBtn" class="btn" style="background: #34BFA3;">Unlock Controls</button>
    <div id="pinFeedback" style="font-size: 11px; margin-top: 4px; color: #FF7A59;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
