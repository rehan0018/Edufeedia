name: Edufeedia Continuous Integration

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Test Suite and Safety Verification
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Redis Connectivity
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -c "import redis; r = redis.from_url('redis://localhost:6379/0'); r.ping(); print('Redis service container reachable.')"

      - name: Seed Database Test Fixtures
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_ci_pipeline_verification_only_64_characters_long
        run: |
          PYTHONPATH=.:backend python backend/scripts/seed_demo_data.py

      - name: Run Backend Unit and Regression Test Suite
        env:
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          SECRET_KEY: test_secret_key_for_ci_pipeline_verification_only_64_characters_long
        run: |
          PYTHONPATH=.:backend pytest backend/tests

      - name: Verify Production Settings Boot Validation
        env:
          ENVIRONMENT: production
          SECRET_KEY: test_secret_key_for_ci_pipeline_verification_only_64_characters_long
          DATABASE_URL: postgresql://ci_user:ci_pass@localhost:5432/ci_db
          REDIS_URL: redis://localhost:6379/0
          SMTP_HOST: smtp.example.com
          SMTP_USER: ci_smtp_user
          SMTP_PASSWORD: ci_smtp_password
        run: |
          PYTHONPATH=.:backend python -c "from app.config import Settings; s = Settings(); print('Production Settings Boot Verification PASSED')"

  frontend-build:
    name: Frontend Asset Compilation and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Compile Production Build
        working-directory: frontend
        run: npm run build

  governance-and-secret-audit:
    name: Governance, Licensing, and Secret Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute Full Git History Secret Audit
        run: |
          python backend/scripts/audit_git_secrets.py

      - name: Verify Required Governance Documents
        run: |
          test -f LICENSE || (echo "Missing LICENSE file" && exit 1)
          test -f NOTICE || (echo "Missing NOTICE file" && exit 1)
          test -f CLA.md || (echo "Missing CLA.md file" && exit 1)
          test -f CONTRIBUTING.md || (echo "Missing CONTRIBUTING.md file" && exit 1)
          test -f SECURITY.md || (echo "Missing SECURITY.md file" && exit 1)
          test -f TRADEMARKS.md || (echo "Missing TRADEMARKS.md file" && exit 1)
          test -f docs/THIRD_PARTY_LICENSES.md || (echo "Missing docs/THIRD_PARTY_LICENSES.md" && exit 1)
          echo "All required governance documents are present."

  docker-smoke-test:
    name: Docker Deployment and Health Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Launch Docker Stack
        run: |
          docker compose up -d --build
          sleep 15
          docker compose ps

      - name: Probe API Health and Ready Endpoints
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health || exit 1
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/ready || exit 1
          echo "Docker Compose services healthy and endpoints verified."

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v
