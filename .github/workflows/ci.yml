name: Edufeedia CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Test Suite, Safety Audits & RAG Verification
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: backend:.
      DATABASE_URL: sqlite:///./edufeedia.db
      SECRET_KEY: test_ci_secret_key_for_edufeedia_platform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed Database Fixtures
        run: |
          python seed.py

      - name: Run Full Automated Test Suite
        run: |
          python -m unittest discover -s backend/tests

  frontend_build:
    name: Frontend React & Vite Production Bundle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build

  docker_build:
    name: Production Docker Container Build
    runs-on: ubuntu-latest
    needs: [test, frontend_build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: edufeedia-backend:latest
