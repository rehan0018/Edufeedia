name: Edufeedia Production CI & Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-matrix:
    name: Backend Test Suite & Security Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edufeedia
          POSTGRES_PASSWORD: edufeedia_password
          POSTGRES_DB: edufeedia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install bcrypt pyjwt python-jose requests sqlalchemy pydantic fastapi uvicorn httpx redis psycopg2-binary numpy

      - name: Run Backend Test Discovery Suite
        env:
          PYTHONPATH: backend
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          ENVIRONMENT: test
          REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://edufeedia:edufeedia_password@localhost:5432/edufeedia_test
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

      - name: Run Empirical AI & Safety Evaluation Benchmark
        env:
          PYTHONPATH: backend
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          python backend/eval/evaluator.py

      - name: Run Recommendation Evaluation Benchmark (NDCG & LGpM)
        env:
          PYTHONPATH: backend
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          python backend/eval/rec_evaluator.py

      - name: Run Randomized Controlled Trial (RCT) Learning Gain Experiment
        env:
          PYTHONPATH: backend
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          python backend/eval/learning_gain_experiment.py

  frontend-build:
    name: Frontend Deterministic Build (npm ci)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies Deterministically
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Production Build
        working-directory: frontend
        run: npm run build

  docker-verification:
    name: Docker Image Build & Runtime Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test-matrix, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t edufeedia-backend:ci backend/
