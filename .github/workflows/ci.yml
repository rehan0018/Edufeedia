name: Edufeedia CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Discovery & Security Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi
          pip install bcrypt pyjwt python-jose requests sqlalchemy pydantic fastapi uvicorn httpx

      - name: Run Backend Test Discovery Suite
        env:
          PYTHONPATH: backend
          SECRET_KEY: ci-test-secret-key-must-be-at-least-32-chars-long
          ENVIRONMENT: test
        run: |
          python -m unittest discover -s backend/tests -p "test_*.py" -v

  frontend-build:
    name: Frontend Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Frontend Build
        working-directory: frontend
        run: npm run build
