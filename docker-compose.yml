version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edufeedia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edufeedia-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-edufeedia_user}:${POSTGRES_PASSWORD:-edufeedia_dev_password_only}@postgres:5432/${POSTGRES_DB:-edufeedia_db}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:-edufeedia-dev-only-insecure-test-signing-key-32chars}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:3000,http://localhost:80}
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: edufeedia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-edufeedia_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edufeedia_dev_password_only}
      - POSTGRES_DB=${POSTGRES_DB:-edufeedia_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-edufeedia_user} -d $${POSTGRES_DB:-edufeedia_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: edufeedia-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
