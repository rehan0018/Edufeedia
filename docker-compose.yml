version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edufeedia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edufeedia-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-edufeedia_user}:${POSTGRES_PASSWORD:-edufeedia_dev_secret_change_in_prod}@postgres:5432/${POSTGRES_DB:-edufeedia_db}}
      - SECRET_KEY=${SECRET_KEY:-edufeedia_dev_jwt_secret_key_2026}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8000,http://localhost:3000,http://localhost:80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./edufeedia_database_records.xlsx:/app/edufeedia_database_records.xlsx

  postgres:
    image: postgres:16-alpine
    container_name: edufeedia-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-edufeedia_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-edufeedia_dev_secret_change_in_prod}
      - POSTGRES_DB=${POSTGRES_DB:-edufeedia_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-edufeedia_user} -d $${POSTGRES_DB:-edufeedia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edufeedia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
